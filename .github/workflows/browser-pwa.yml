name: Package browser PWA
on:
  push:
    branches: ["main"]
    paths:
      - "mobile/www/**"
      - ".github/workflows/browser-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package browser PWA
        uses: actions/upload-artifact@v4
        with:
          name: upscayl-browser-pwa
          path: mobile/www
          if-no-files-found: error
          retention-days: 30
