name: Deploy browser PWA
on:
  push:
    branches: ["main"]
    paths:
      - "mobile/www/**"
      - ".github/workflows/browser-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package browser PWA
        uses: actions/upload-artifact@v4
        with:
          name: upscayl-browser-pwa
          path: mobile/www
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload PWA site
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
